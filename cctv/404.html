    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    background:var(--matte-black);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    font-weight:300;
    display:flex;

  body::before{

  .bg-glow{

  }

  .eyebrow{

    color:var(--champagne-dim);
    display:flex;align-items:center;justify-content:center;gap:.9rem;
    margin-bottom:1.6rem;
  }
  .eyebrow::before,.eyebrow::after{content:'';width:26px;height:1px;background:var(--champagne-dim);flex-shrink:0;}

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(2.2rem,7vw,3.4rem);
    line-height:1.1;
    letter-spacing:-.01em;
    margin-bottom:1rem;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--champagne);}

  p.desc{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    font-size:1.05rem;
    color:var(--ivory-dim);
    line-height:1.75;
    max-width:38ch;
    margin:0 auto 2.6rem;
  }

  .actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.2rem;}
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    padding:1rem 2.1rem;
    border:1px solid var(--champagne);
    color:var(--champagne);
    background:transparent;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    cursor:pointer;
    transition:background .35s var(--ease),color .35s var(--ease),opacity .3s;
  }
  .btn:hover{background:var(--champagne);color:#fbf8f2;}
  .btn.solid{background:var(--champagne);color:#fbf8f2;}
  .btn.solid:hover{opacity:.85;}

  .redirect-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:.65rem;
    letter-spacing:.1em;
    color:var(--ivory-dim);
  }
  .redirect-note span{color:var(--champagne);font-weight:500;}
  .redirect-note a{color:var(--ivory-dim);text-decoration:underline;text-underline-offset:3px;transition:color .3s;}
  .redirect-note a:hover{color:var(--champagne);}

  @media (max-width:480px){
    .couch-mark{width:120px;}

<body>

<div class="bg-glow"></div>

<div class="content">

  <svg class="couch-mark" viewBox="0 0 400 240" fill="none">
    <path d="M40 150 C40 110 70 95 200 95 C330 95 360 110 360 150 L360 190 L40 190 Z" stroke-width="1.2"/>
    <path d="M40 150 L40 120 C40 105 55 95 75 95" stroke-width="1.2"/>
    <path d="M360 150 L360 120 C360 105 345 95 325 95" stroke-width="1.2"/>
    <line x1="40" y1="190" x2="40" y2="215" stroke-width="1.2"/>
    <line x1="130" y1="190" x2="130" y2="215" stroke-width="1.2"/>
    <line x1="270" y1="190" x2="270" y2="215" stroke-width="1.2"/>
    <line x1="360" y1="190" x2="360" y2="215" stroke-width="1.2"/>
    <line x1="150" y1="100" x2="150" y2="150" stroke-width=".6" stroke-dasharray="2 4"/>
    <line x1="250" y1="100" x2="250" y2="150" stroke-width=".6" stroke-dasharray="2 4"/>
  </svg>

  <div class="eyebrow">404</div>
  <h1>This room isn't<br><em>part of the house.</em></h1>
  <p class="desc">The page you're looking for has been moved, renamed, or was never part of the collection. Let's get you back to the showroom.</p>

  <div class="actions">
    <a href="/cctv/cctv/index.html" class="btn solid">Back to Cassava Couch</a>
    <a href="/cctv/cctv/index.html#shop" class="btn">Go to Shop</a>
  </div>

  <p class="redirect-note" id="redirectNote">
    Redirecting you home in <span id="countdown">8</span>s — or <a href="#" id="cancelLink">stay on this page</a>.
  </p>

</div>

<script>
  const HOME_URL = '/cctv/cctv/index.html';
  let seconds = 8;
  let cancelled = false;
  const countdownEl = document.getElementById('countdown');
  const noteEl = document.getElementById('redirectNote');
  const cancelLink = document.getElementById('cancelLink');

  const timer = setInterval(() => {
    if (cancelled) { clearInterval(timer); return; }
    seconds -= 1;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = HOME_URL;
      return;
    }
    countdownEl.textContent = seconds;
  }, 1000);

  cancelLink.addEventListener('click', (e) => {
    e.preventDefault();
    cancelled = true;
    clearInterval(timer);
    noteEl.textContent = "Redirect cancelled — take your time.";
  });
</script>

</body>
